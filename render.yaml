# Blueprint Render — API Laravel du Manoir (Docker) + base Postgres externe (Neon).
# Déploiement : Render > New > Blueprint > sélectionner ce repo.
# Les variables `sync: false` sont à renseigner dans le dashboard Render (secrets).
services:
  - type: web
    name: manoir-api
    runtime: docker
    plan: free
    region: frankfurt # le plus proche du Bénin
    branch: main
    dockerfilePath: ./manoir-backend/Dockerfile
    dockerContext: ./manoir-backend
    healthCheckPath: /up # route santé intégrée à Laravel 11+
    # Migrations jouées à chaque déploiement (idempotent)
    preDeployCommand: php artisan migrate --force
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Manoir
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Générer en local : `php artisan key:generate --show` puis coller la valeur (base64:...)
      - key: APP_KEY
        sync: false
      # URL publique de CETTE API sur Render (ex: https://manoir-api.onrender.com) — à remplir après le 1er déploiement
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # --- Base de données : Neon (Postgres) ---
      - key: DB_CONNECTION
        value: pgsql
      # Depuis la "Connection string" Neon (utiliser l'hôte POOLED : ...-pooler...neon.tech)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require # Neon exige le SSL

      # --- Sessions / cache / queue en base (tables créées par les migrations) ---
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # --- CORS : origine du frontend Vercel (ex: https://le-manoir.vercel.app) ---
      - key: FRONTEND_URL
        sync: false

      # --- Agendas Google : un par appartement (adresses iCal secretes) ---
      # A renseigner dans le dashboard Render, jamais dans le depot.
      - key: GOOGLE_CALENDAR_ICAL_1
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_2
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_3
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_4
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_5
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_6
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_7
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_8
        sync: false
      - key: GOOGLE_CALENDAR_ICAL_GENERAL
        sync: false
      # Jeton attendu par POST /api/calendar/sync, appele par un cron externe.
      # Le plan gratuit Render ne fournit pas de taches planifiees.
      - key: CALENDAR_SYNC_TOKEN
        sync: false

      # --- Mail : Brevo (SMTP relay), 300 envois/jour sur le palier gratuit ---
      # Repasser MAIL_MAILER a "log" pour desactiver tout envoi reel.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      # Login SMTP Brevo (SMTP & API > onglet SMTP), ex: 9a1b2c001@smtp-brevo.com
      - key: MAIL_USERNAME
        sync: false
      # Cle SMTP Brevo (xsmtpsib-...) : secret, a saisir dans le dashboard Render
      - key: MAIL_PASSWORD
        sync: false
      # Doit etre un expediteur valide dans Brevo (Senders & IP > Senders)
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Le Manoir
